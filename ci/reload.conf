# The part of the reload test that differs per module.  ci/reload.sh sources
# this with $WORK and $PORT already set and then drives the reloads.  The
# stream listener is one port above the http one.
#
#     RELOAD_STREAM  directives for a stream block, may be empty
#     RELOAD_HTTP    directives for the http block, may be empty
#     RELOAD_SERVER  directives for the server block
#     RELOAD_EXPECT  what reload_probe has to print
#     reload_probe   prints what the server answered

# shellcheck shell=sh
# shellcheck disable=SC2034  # ci/reload.sh reads these after sourcing this file
#
# The limit lives in a shared memory zone, and a zone is the kind of thing a
# reload can lose: name and size have to match the previous cycle for nginx
# to keep it.  The rate here is high enough that the probe is never the
# connection that gets refused -- what is being watched is whether the zone,
# and with it the module, survives eight cycles.

SPORT=$((PORT + 1))

RELOAD_STREAM="
    limit_req_zone \$binary_remote_addr zone=reload:1m rate=100r/s;

    server {
        listen 127.0.0.1:$SPORT;
        limit_req zone=reload burst=50 nodelay;
        return \"reloaded\";
    }"

RELOAD_HTTP=""

RELOAD_SERVER="
        location /probe {
            return 200 \"up\";
        }"

RELOAD_EXPECT='reloaded'

reload_probe() {
	perl -e '
	    use IO::Socket::INET;
	    my $s = IO::Socket::INET->new(PeerAddr => "127.0.0.1",
	                                  PeerPort => $ARGV[0],
	                                  Proto => "tcp", Timeout => 5) or exit 0;
	    my $buf = "";
	    eval {
	        local $SIG{ALRM} = sub { die };
	        alarm 5;
	        $s->sysread($buf, 64);
	        alarm 0;
	    };
	    print $buf;
	' "$SPORT"
}
